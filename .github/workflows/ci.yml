name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22", "1.25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go test -run=^$ -fuzz=FuzzHeadMatchesReference -fuzztime=20s ./...
